<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHAKWEER NET Web POS</title><link rel="stylesheet" href="/static/app.css"></head><body><aside><div class="brand">SHAKWEER <b>NET</b></div><div class="user">{{user.full_name}}<small>{{'مدير' if user.role=='admin' else 'كاشير'}}</small></div><nav id="nav">{% for id,label,perm in pages %}{% if user.role=='admin' or user[perm] %}<button data-id="{{id}}" onclick="openPage('{{id}}','{{label}}')">{{label}}</button>{% endif %}{% endfor %}</nav><form method="post" action="/logout"><button class="logout">تسجيل الخروج</button></form></aside><main><header><div><h1 id="title">الرئيسية</h1><span id="clock"></span></div><button class="refresh" onclick="loadCurrent()">↻ تحديث</button></header><section id="content"></section></main><script src="/static/app.js"></script></body></html>
