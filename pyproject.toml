[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shakweer-net-pos"
version = "2.0.0"
description = "SHAKWEER NET Web POS"
requires-python = ">=3.13,<3.14"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"
